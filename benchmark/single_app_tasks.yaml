#   高德地图  poi_nearby_search3 route_planning2 hail_ride1 plan_trip2                       = 8
#   WPS       foundation_llm2 generate_slides1 generate_document3 find_file1                 = 7
#   携程      foundation_llm3 book_flight1 book_hotel1 book_train1 plan_trip1                = 7
#   微信      search_vertical_content5                                                       = 5
#   小红书    search_vertical_content6                                                       = 6

