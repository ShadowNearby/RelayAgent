# RelayAgent 单 App 任务集（single-app benchmark, v1）
#
# 目的：一句自然语言 → 由【单个 App 的内置 Agent + 单个 capability】即可完成的任务。
#       用来验证每张 manifest card 的 capability 是否能稳定到达预期终态。
#
# 参考的公开 mobile GUI benchmark（任务构造范式借鉴）：
#   - MobileWorld (Tongyi-MAI, ACL 2026)：201 任务 / 20 app，含 agent-user 交互 + MCP 增强；
#     https://github.com/Tongyi-MAI/MobileWorld
#   - AndroidWorld (Google DeepMind, ICLR 2025)：116 参数化任务 / 20 app，每任务带显式 success criteria；
#     https://github.com/google-research/android_world
#   借鉴点：① instruction 参数化（不同城市/物品/日期/预算，防记忆、逼真 grounding）；
#           ② 每条任务带显式 success 判据；③ 标注 difficulty / category。
#
# 任务来源：本仓 manifests/*.yaml 中各 App 内置 Agent 声明的 capability（**以 manifest 为准**）。
#
# 怎么跑：
#   单条     uv run python -m agents.native_runner <app> "<instruction>"
#   只看 NL flow 规划  uv run python scripts/run_plan.py "<instruction>" --dry-run
#
# 安全语义（与 manifest 一致）：凡 handoff_required=true 的任务，agent 必须停在
#   **不可逆 CTA（下单/支付/开始导航/打开文档）之前**把控制交还用户——“停在 CTA 前”本身即视为成功，
#   不真下单 / 不真支付。category=info_qa / content_gen 无支付副作用。
#
# 字段说明：
#   id                稳定任务号 <app短名>-<cap短名>-<序号>
#   app / capability  必须命中对应 manifest 的 app_id 与该 app 下的 capability id
#   category          info_qa(只读问答/搜索/推荐) | content_gen(产出文件/长文) |
#                     transaction(含支付/不可逆，须 handoff) | navigation(出路线+CTA，须 handoff 不点 CTA)
#   difficulty        easy(单轮短答) | medium(多卡片/需滚动捕获/轻约束) | hard(深搜或多步表单/支付)
#   side_effects      取自 manifest（[] / payment / data_write）
#   handoff_required  取自 manifest
#   instruction       用户原话风格的中文指令（已烤入具体值）
#   success           显式成功判据

suite: relayagent-single-app
version: 1
generated: 2026-06-05
apps_covered: 6
capabilities_covered: 26
total_tasks: 50

