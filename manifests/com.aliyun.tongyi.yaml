spec_version: "0.1"
card_version: "0.2.0"
app_id: "com.aliyun.tongyi"
app_name: "通义千问"
platforms: ["android"]
locale: ["zh-CN"]

embedded_agent:
  name: "千问"
  description: >
    Alibaba's Tongyi Qianwen App — the entire app is an AI agent surface.
    Built-in orchestration layer routes intents (train/food/ride/hotel/movie/
    shopping) to Alibaba partner apps (Fliggy, Taobao Flash, Taobao, Amap,
    Damai) via OAuth.
    Three auth tiers affect completion semantics; see OQ-12.

  entry:
    primary:
      method: tap_sequence
      steps: []
    x_prepare_fresh_conversation:
      description: >
        Start a new conversation before real-device tests to avoid stale context.
      steps:
        - tap_screen_fraction:
            x_ratio: 0.075
            y_ratio: 0.10
        - tap_label:
            text_or_desc: "新建对话"
        - wait:
            until: { text: "发消息或按住说话..." }
            timeout_seconds: 0.5

  invocation:
    input:
      # EditText has no resource-id; tap-through on placeholder TextView sibling.
      field: { text: "发消息或按住说话..." }
    submit:
      # Same FrameLayout: empty → "+", has text → send arrow. No a11y metadata; bounds-only. See OQ-11.
      trigger:
        x_bounds:
          box: [916, 2094, 1027, 2205]
          anchor: bottom_right

  output:
    method: none

  capabilities:

    - id: foundation_llm
      description: >
        Foundation LLM capability in Tongyi Qianwen: general Q&A, explanation,
        rewriting, translation, summarization, extraction, comparison, and light
        data transformation. Pure chat output with no partner-app handoff.
      example_prompts:
        - "讲讲二战中的中途岛海战"
        - "帮我把这段话改得更书面一点：……"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 8

    - id: poi_nearby_search
      description: >
        Nearby POI search and local discovery via Tongyi's partner-app
        orchestration. The assistant can search for nearby places such as
        restaurants, cafes, convenience stores, attractions, or services, and
        return recommended options with basic location context. It does not
        start navigation, place orders, or make reservations automatically.
      example_prompts:
        - "帮我找上海图书馆东馆南门附近评分高的咖啡店"
        - "搜一下前滩太古里石区周边24小时便利店"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 10
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "com.autonavi.minimap"
      x_partner_auth: "oauth_preauthorized"

    - id: route_planning
      description: >
        Route planning via Tongyi's map orchestration, including address parsing,
        destination disambiguation, route options, distance, ETA, and traffic
        estimates. It may surface a navigation CTA, but scripted flows stop
        before live turn-by-turn guidance so the user can confirm.
      example_prompts:
        - "从上海儿童医学中心门诊楼到虹桥火车站南进站口怎么走"
        - "我现在去张江人工智能岛7号楼大概要多久"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 12
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "com.autonavi.minimap"
      x_partner_auth: "oauth_preauthorized"

    - id: live_navigation
      description: >
        Turn-by-turn navigation handoff through Tongyi's Amap integration. The
        assistant can prepare the destination and route choice, then must hand
        control back before starting live navigation because driving/walking
        guidance is an ongoing physical-world action.
      example_prompts:
        - "导航去徐家汇地铁站14号口附近最近的24小时便利店"
        - "帮我开始导航到上海南站南广场进站口"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 10
      x_partner_app: "com.autonavi.minimap"
      x_partner_auth: "oauth_preauthorized"

    - id: book_train
      description: >
        Train-ticket search and booking via Fliggy/12306. The assistant lists
        train cards with number, time, price, and seat availability; ticketing,
        credentials, passenger details, and payment require user handoff.
      example_prompts:
        - "帮我买明天下午两点左右去南京的高铁"
        - "周五早上 8 点上海到杭州的二等座票"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 20
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "com.taobao.trip"
      x_partner_service: "12306"
      x_partner_auth: "service_credential"

    - id: book_flight
      description: >
        Flight search and booking via Fliggy. The assistant parses route, date,
        time window, cabin, and price constraints, then returns flight options
        or a partner booking card. Passenger details, ticketing, and payment
        require user handoff.
      example_prompts:
        - "帮我找下周一上海到北京下午的机票"
        - "明天最便宜的虹桥飞成都的航班"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 20
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "com.taobao.trip"
      x_partner_auth: "oauth_preauthorized"

    - id: order_food
      description: >
        Food ordering and local delivery via Taobao Flash. The assistant searches
        nearby stores, recommends items, applies stored address/preferences, and
        can proceed to checkout, but final order/address/payment confirmation is
        irreversible and must be handed to the user.
      example_prompts:
        - "帮我点三杯蜜雪冰城蜜桃四季春"
        - "晚上点份麻辣烫，30 块以内"
        - "我想点份陆家嘴中心L+南门附近的外卖"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 8
      x_partner_app: "com.taobao.litetao"
      x_partner_auth: "oauth_bind_required"
      x_post_result_flow:
        description: >
          After recommendations appear: pick default item and default spec,
          stop before payment confirmation. Accept defaults for temp/sugar options.
        steps:
          - tap_label:
              text_or_desc: "选这个"
          - tap_label:
              text_or_desc: "选好了"
          - wait:
              ms: 3000
        stop_before:
          - "支付宝付款"

    - id: search_product
      description: >
        Product search, recommendation, and comparison via Taobao. The assistant
        parses budget, brand, specs, use case, delivery constraints, reviews,
        and promotions, then returns product cards or comparison guidance. It
        does not auto-order; purchase/pre-checkout intents route to
        purchase_guidance.
      example_prompts:
        - "帮我找一台适合学生的平板电脑，预算2000以内"
        - "推荐几款夏天通勤穿的男士防晒衣"
        - "iPhone 17 和上一代买哪个更划算"
      executable: true
      handoff_to_user_required: false
      typical_latency_seconds: 12
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "com.taobao.taobao"
      x_partner_auth: "oauth_bind_required"

    - id: track_order
      description: >
        Order, logistics, after-sales, or refund-status lookup via Taobao. This
        capability is read-only; if the user wants to initiate a return, refund,
        or modification, switch to a handoff flow.
      example_prompts:
        - "我最近买的键盘到哪了"
        - "查一下刚才那单有没有发货"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 10
      x_capture_full_reply:
        max_scrolls: 4
      x_partner_app: "com.taobao.taobao"
      x_partner_auth: "oauth_bind_required"

    - id: hail_ride
      description: >
        Ride hailing via Amap's aggregator from within Tongyi. The assistant
        helps confirm origin/destination, car type, estimate, and payment path;
        irreversible ride/payment confirmations require user handoff.
      example_prompts:
        - "叫一辆经济型车去上海博物馆东馆北门"
        - "帮我叫个车去杨浦滨江船厂1862"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 12
      x_partner_app: "com.autonavi.minimap"
      x_partner_auth: "oauth_preauthorized"

    - id: book_hotel
      description: >
        Hotel search and booking via Fliggy. The assistant parses city, district,
        price range, dates, and guests, recommends options, and links to room
        selection and Alipay payment. User handoff is required before booking.
      example_prompts:
        - "帮我在上海订一晚酒店，明天入住"
        - "北京三里屯附近 500 以内的酒店，明晚入住"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 18
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "com.taobao.trip"
      x_partner_auth: "oauth_preauthorized"

    - id: book_movie_event
      description: >
        Movie or event ticket search and purchase via Damai. The assistant can
        search showtimes, seats, and ticket options, but OAuth binding, seat
        choice, order confirmation, and payment require user handoff.
      example_prompts:
        - "帮我买今晚上海的电影票"
        - "周六下午看星球大战, 选两张连座"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 15
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "cn.damai"
      x_partner_auth: "oauth_bind_required"

provenance:
  last_verified: "2026-05-11"
  verified_app_version: "6.9.1.2875"
  verified_os: "android-16"
  verified_device: "Pixel 9"
  verification_method: scripted
  evidence_url: ""
  x_device_metrics:
    resolution_px: [1080, 2424]
    density_dpi: 420

constraints:
  app_version_min: "6.9.0"
  region: ["CN"]
  network_required: true
  known_issues:
    - "Main UI exposes no resource-ids — EditText, send btn, mode toggles all rely on placeholder text or bounds."
    - "Send button and '+' are the same FrameLayout; no a11y metadata, bounds-only."
    - "Auth management page lists 7 partners, but Damai (movies) works too — partner pool expands at runtime."
    - "Agent auto-detects intent type without mode switch; OS router does not need to select mode."
    - "12306 auth (book_train) is service_credential tier — requires password every session even with Fliggy authorized. See OQ-12."
    - "First-time OAuth bind modal requires user to tap 'Authorize'; declining terminates the task."
    - "x_partner_app / x_partner_service / x_partner_auth are v0.1 extensions (x_ prefix); v0.2 plans to promote. See OQ-12."
