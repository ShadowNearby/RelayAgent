spec_version: "0.1"
card_version: "0.1.0"
app_id: "com.aliyun.tongyi"
app_name: "通义千问"
platforms: ["android"]
locale: ["zh-CN"]

embedded_agent:
  name: "千问"
  type: native_in_app_agent
  description: >
    Alibaba's Tongyi Qianwen App — the entire app is an AI agent surface.
    Built-in orchestration layer routes intents (train/food/ride/hotel/movie/
    shopping) to Alibaba partner apps (Fliggy, Taobao Flash, Taobao, Amap,
    Damai) via OAuth.
    Three auth tiers affect completion semantics; see OQ-12.

  entry:
    primary:
      method: tap_sequence
      steps: []
    fallback: []
    x_prepare_fresh_conversation:
      description: >
        Start a new conversation before real-device tests to avoid stale context.
      steps:
        - tap_screen_fraction:
            label: "open_left_menu"
            x_ratio: 0.075
            y_ratio: 0.10
        - tap_label:
            text_or_desc: "新建对话"
            timeout_seconds: 0.5
            scroll_attempts: 0
        - wait:
            until: { text: "发消息或按住说话..." }
            timeout_seconds: 0.5

  invocation:
    input:
      # EditText has no resource-id; tap-through on placeholder TextView sibling.
      field: { text: "发消息或按住说话..." }
      max_chars: 2000
    submit:
      # Same FrameLayout: empty → "+", has text → send arrow. No a11y metadata; bounds-only. See OQ-11.
      trigger:
        x_bounds:
          box: [916, 2094, 1027, 2205]
          anchor: bottom_right
    prompt_template: "{{user_prompt}}"

  output:
    method: none

  capabilities:

    - id: chat
      description: >
        General Q&A and conversation. Pure LLM response, no partner-app
        handoff, no side effects.
      example_prompts:
        - "讲讲二战中的中途岛海战"
        - "帮我把这段话改得更书面一点：……"
      executable: false
      side_effects: []
      requires_login: false
      reversible: true
      handoff_to_user_required: false
      typical_latency_seconds: 8

    - id: book_train
      description: >
        Search and book train tickets by natural language. Agent lists trains
        in cards (number, time, price, seat availability); user taps the booking
        CTA → ticketing flow → payment. Booked via Fliggy: Fliggy OAuth is
        pre-authorized at app level, but 12306 requires manual password entry
        each session (service_credential tier). See OQ-12.
      example_prompts:
        - "帮我买明天下午两点左右去南京的高铁"
        - "周五早上 8 点上海到杭州的二等座票"
      executable: true
      side_effects:
        - payment
      requires_login: true
      reversible: false
      handoff_to_user_required: true
      typical_latency_seconds: 20
      x_capture_full_reply:
        max_scrolls: 6
      failure_modes:
        - "12306 not logged in → stops at login sheet; user must enter credentials"
        - "Fliggy returns no results → asks for time range clarification"
      x_partner_app: "com.taobao.trip"
      x_partner_service: "12306"
      x_partner_auth: "service_credential"

    - id: order_food
      description: >
        Order food / local delivery via Taobao Flash (淘宝闪购). Agent searches
        nearby stores for drinks, meals, or daily items by location, recommends
        items, and triggers checkout with stored address and preferences.
        Order, address, and payment are irreversible; must hand off.
      example_prompts:
        - "帮我点三杯蜜雪冰城蜜桃四季春"
        - "晚上点份麻辣烫，30 块以内"
        - "我想点份附近的外卖"
      executable: true
      side_effects:
        - payment
      requires_login: true
      reversible: false
      handoff_to_user_required: true
      typical_latency_seconds: 8
      # Mixue/Taobao-Flash order_food renders the store recommendation in a single
      # bubble already fully visible at done-detection — capture_full scrolling only
      # added latency (and risked scrolling the CTA out of view) without recovering
      # more text. Treat as single-bubble: rely on done-detection scrape, no scroll.
      failure_modes:
        - "OAuth bind required on first use; flow terminates if user declines"
      x_partner_app: "com.taobao.litetao"
      x_partner_auth: "oauth_bind_required"
      x_post_result_flow:
        description: >
          After recommendations appear: pick default item and default spec,
          stop before payment confirmation. Accept defaults for temp/sugar options.
        steps:
          - tap_label:
              text_or_desc: "选这个"
              timeout_seconds: 1
              scroll_attempts: 2
          - tap_label:
              text_or_desc: "选好了"
              timeout_seconds: 0.3
              scroll_attempts: 0
          - wait:
              ms: 3000
        stop_before:
          - "支付宝付款"

    - id: search_product
      description: >
        Search and recommend products by natural language via Taobao. Parses
        budget, brand, specs, use case, delivery constraints. Returns product
        cards or search results. Agent does not auto-order; user selects
        manually. Same shopping backend as the Taobao in-app assistant (whose
        chat surface is itself 千问); routed here through Taobao.
      example_prompts:
        - "帮我找一台适合学生的平板电脑，预算2000以内"
        - "推荐几款夏天通勤穿的男士防晒衣"
      executable: true
      side_effects: []
      requires_login: true
      reversible: true
      handoff_to_user_required: false
      typical_latency_seconds: 12
      x_capture_full_reply:
        max_scrolls: 6
      failure_modes:
        - "Too few constraints → follow-up questions (budget, size, brand, use case)"
        - "Clicking product cards may leave agent chat for product detail page"
      x_partner_app: "com.taobao.taobao"
      x_partner_auth: "oauth_bind_required"

    - id: compare_products
      description: >
        Compare products by price, specs, reviews, and promotions via Taobao.
        Informational output only; does not purchase.
      example_prompts:
        - "iPhone 17 和上一代买哪个更划算"
        - "帮我比较这几款扫地机器人适合养宠家庭吗"
      executable: false
      side_effects: []
      requires_login: true
      reversible: true
      handoff_to_user_required: false
      typical_latency_seconds: 15
      x_capture_full_reply:
        max_scrolls: 6
      x_partner_app: "com.taobao.taobao"
      x_partner_auth: "oauth_bind_required"

    - id: buy_product
      description: >
        Guide purchase flow for a specific product via Taobao: find listing,
        confirm specs, apply coupons, add to cart, jump to checkout. Final order
        confirmation and payment must be manual; OS router must not auto-submit.
      example_prompts:
        - "帮我买一包猫砂，膨润土的，10公斤左右"
        - "把这款黑色 256G 手机加入购物车"
      executable: true
      side_effects:
        - payment
      requires_login: true
      reversible: false
      handoff_to_user_required: true
      typical_latency_seconds: 15
      failure_modes:
        - "Specs, quantity, address, or coupon ambiguous → user must manually select"
        - "Checkout/payment pages require manual confirmation; scripts must not tap"
      x_partner_app: "com.taobao.taobao"
      x_partner_auth: "oauth_bind_required"

    - id: track_order
      description: >
        Query order status, logistics, after-sale progress, or refund status
        via Taobao. Read-only; does not modify orders. If user initiates
        return/refund, switch to handoff flow.
      example_prompts:
        - "我最近买的键盘到哪了"
        - "查一下刚才那单有没有发货"
      executable: false
      side_effects: []
      requires_login: true
      reversible: true
      handoff_to_user_required: false
      typical_latency_seconds: 10
      x_capture_full_reply:
        max_scrolls: 4
      failure_modes:
        - "Multiple matching orders → user must pick the specific one"
      x_partner_app: "com.taobao.taobao"
      x_partner_auth: "oauth_bind_required"

    - id: hail_ride
      description: >
        Hail a ride via Amap's aggregator. Multi-step: confirm origin/destination →
        choose car type → confirm estimate → pay (Alipay), each step user-operated
        within the agent's response card. Amap OAuth is pre-authorized by default.
        Same underlying service as the com.autonavi.minimap manifest; OS router
        should route by context.
      example_prompts:
        - "叫一辆经济型车去虹桥机场"
        - "帮我叫个车回家"
      executable: true
      side_effects:
        - payment
      requires_login: true
      reversible: false
      handoff_to_user_required: true
      typical_latency_seconds: 12
      failure_modes:
        - "Missing origin/destination → agent asks for clarification"
        - "Alipay balance insufficient → payment password prompt"
      x_partner_app: "com.autonavi.minimap"
      x_partner_auth: "oauth_preauthorized"

    - id: book_hotel
      description: >
        Search and book hotels by natural language. Agent parses city, district,
        price range, dates, and guests, recommends options with address/rating/
        price in cards; user taps the booking CTA → room selection → payment.
        Booked via Fliggy: OAuth pre-authorized, no login friction; CTA →
        Fliggy booking flow → Alipay payment.
      example_prompts:
        - "帮我在上海订一晚酒店，明天入住"
        - "北京三里屯附近 500 以内的酒店，明晚入住"
      executable: true
      side_effects:
        - payment
      requires_login: true
      reversible: false
      handoff_to_user_required: true
      typical_latency_seconds: 18
      x_capture_full_reply:
        max_scrolls: 6
      failure_modes:
        - "No results or sold out → agent asks to expand search criteria"
      x_partner_app: "com.taobao.trip"
      x_partner_auth: "oauth_preauthorized"

    - id: book_movie
      description: >
        Search and book movie tickets via Damai. First use triggers OAuth bind
        modal (phone number selection); once authorized, agent searches showtimes,
        selects seats, and purchases.
      example_prompts:
        - "帮我买今晚上海的电影票"
        - "周六下午看哪吒, 选两张连座"
      executable: true
      side_effects:
        - payment
      requires_login: true
      reversible: false
      handoff_to_user_required: true
      typical_latency_seconds: 15
      x_capture_full_reply:
        max_scrolls: 6
      failure_modes:
        - "OAuth bind required on first use; flow terminates if user declines"
        - "Damai not in static auth management list; partner pool is runtime-expanded"
      x_partner_app: "cn.damai"
      x_partner_auth: "oauth_bind_required"

provenance:
  last_verified: "2026-05-11"
  verified_app_version: "6.9.1.2875"
  verified_os: "android-16"
  verified_device: "Pixel 9"
  verification_method: scripted
  evidence_url: ""
  x_device_metrics:
    resolution_px: [1080, 2424]
    density_dpi: 420

constraints:
  app_version_min: "6.9.0"
  region: ["CN"]
  network_required: true
  known_issues:
    - "Main UI exposes no resource-ids — EditText, send btn, mode toggles all rely on placeholder text or bounds."
    - "Send button and '+' are the same FrameLayout; no a11y metadata, bounds-only."
    - "Auth management page lists 7 partners, but Damai (movies) works too — partner pool expands at runtime."
    - "Agent auto-detects intent type without mode switch; OS router does not need to select mode."
    - "12306 auth (book_train) is service_credential tier — requires password every session even with Fliggy authorized. See OQ-12."
    - "First-time OAuth bind modal requires user to tap 'Authorize'; declining terminates the task."
    - "x_partner_app / x_partner_service / x_partner_auth are v0.1 extensions (x_ prefix); v0.2 plans to promote. See OQ-12."
