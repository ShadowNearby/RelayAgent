spec_version: "0.1"
card_version: "0.2.0"
app_id: "ctrip.android.view"
app_name: "携程旅行"
platforms: ["android"]
locale: ["zh-CN"]

embedded_agent:
  name: "携程问道"
  description: >
    Ctrip's travel AI assistant, launched from the persistent bottom input
    "Ask AI or hold to talk". Covers flights, hotels, trains, attraction
    tickets, package tours, and travel Q&A. First-party platform — no partner
    OAuth friction, but agent-wide mandatory Ctrip login. Built-in task-specific
    modes activate automatically by query complexity.

  entry:
    primary:
      method: tap_sequence
      steps:
        # Persistent bottom AI entry placeholder TextView on home tab.
        # Tap-through to parent clickable region opens half-sheet.
        # Only visible on home tab; if on other tab, router must return home first.
        - tap: { text: "问AI或按住说话" }

  invocation:
    input:
      # Current version no longer exposes the old EditText resource-id.
      # Placeholder TextView text is stable; tap-through per §6.1 triggers parent input focus.
      field: { text: "任何旅游相关问题都可以问我哦" }
    submit:
      # Send button is an ImageView with only content-desc="image"; bounds as fallback.
      trigger:
        x_bounds:
          box: [927, 2079, 1011, 2163]
          anchor: bottom_right

  output:
    method: none

  capabilities:

    - id: poi_nearby_search
      description: >
        Travel-oriented POI and nearby search through Ctrip's AI assistant. Use
        for attractions, restaurants, hotels, transportation hubs, family venues,
        and local travel services. The assistant returns recommendations or
        travel context and does not book or pay through this capability.
      example_prompts:
        - "上海天文馆游客中心附近有什么适合亲子的景点"
        - "世博源1区附近有哪些适合商务聚餐的餐厅"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 20
      x_capture_full_reply:
        max_scrolls: 6

    - id: book_flight
      description: >
        Flight search and booking through Ctrip. The assistant parses route,
        date/time, cabin, and price constraints, returns flight cards, and
        exposes a CTA into the native booking flow for seat/passenger/payment
        steps. User handoff is required before purchase.
      example_prompts:
        - "帮我找下周一上海到北京下午的机票"
        - "明天最便宜的虹桥飞成都的航班"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 25
      x_capture_full_reply:
        max_scrolls: 6

    - id: book_hotel
      description: >
        Hotel search and booking through Ctrip. The assistant parses city,
        district, price range, dates, and guests, then provides hotel cards or
        an Explore CTA into the native room-selection and payment flow. User
        handoff is required before booking.
      example_prompts:
        - "上海外滩附近 800 以内的酒店，明晚入住"
        - "周末北京三里屯有湾景的酒店"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 20
      x_capture_full_reply:
        max_scrolls: 6

    - id: book_train
      description: >
        Train-ticket search and booking through Ctrip. The assistant returns
        train cards with number, duration, price, and seat availability, then
        links into the native ticketing flow. User handoff is required before
        passenger details, 12306-backed ticketing, and payment.
      example_prompts:
        - "周五早上 8 点北京到天津的高铁"
        - "明天去苏州最早的车次"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 18
      x_capture_full_reply:
        max_scrolls: 6

    - id: plan_trip
      description: >
        Travel itinerary planning in Ctrip, combining attractions, dining,
        hotels, routes, and packaged-tour SKUs. The first response exposes a
        route-planning card; the dedicated itinerary form and any bookable
        products require user handoff.
      example_prompts:
        - "我想十一去三亚玩四天怎么安排"
        - "暑假带孩子去云南怎么玩"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 25
      x_post_result_flow:
        steps:
          - tap: { text: "获取专属行程" }
          - wait: { ms: 2000 }
          - wait_for_reply: { max_seconds: 90 }

provenance:
  last_verified: "2026-05-19"
  verified_app_version: "8.91.6"
  verified_os: "android-16"
  verified_device: "Pixel 9"
  verification_method: scripted
  evidence_url: ""
  x_device_metrics:
    resolution_px: [1080, 2424]
    density_dpi: 420

constraints:
  app_version_min: "8.91.0"
  region: ["CN"]
  network_required: true
  known_issues:
    - "Mandatory Ctrip login; tapping send while logged out triggers login sheet. Task terminates if user cancels."
    - "AI entry only visible on home tab. If on other tab, router must tap 'Home' first (not covered by this manifest)."
    - "Task-specific modes (deep-think, PK, hotel compare, photo, menu translate) auto-activate; router should not switch them manually."
    - "Booking CTAs navigate to CRNBaseActivityV2 (React Native flow). User stays in app, but agent chat history is no longer visible."
    - "Train ticketing via Ctrip backend → 12306; user sees no 12306 login (unlike Qianwen manifest's 12306 password gate)."
    - "Input area no longer exposes legacy resource-id; use placeholder tap-through."
    - "Send button has no unique a11y metadata (cd='image' only); bounds fallback, resolution-sensitive."
    - "Agent name '携程问道' in title bar (resource_id=gs_wendaodialog_view_new) can serve as 'AI panel is open' anchor."
