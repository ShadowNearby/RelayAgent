spec_version: "0.1"
card_version: "0.2.0"
app_id: "com.google.android.apps.bard"
app_name: "Gemini"
platforms: ["android"]
locale: ["en-US"]

embedded_agent:
  name: "Gemini"
  description: >
    Google's Gemini Android app. Launcher package is
    `com.google.android.apps.bard`, while the visible chat UI is hosted by the
    Google app / GSA package (`com.google.android.googlequicksearchbox`) under
    assistant_robin_* views. The main surface is a multimodal chat agent with
    text input, attachment picker, camera/photo upload, file/Drive upload,
    Gemini Live, and tool modes such as image generation, music generation,
    Canvas, Deep Research, and learning help. It is strongest at information
    tasks, writing, summarization, public web/search retrieval, Google-service
    tasks when authorized, and reasoning over user-provided files/images. It
    generally cannot operate non-Google third-party accounts such as Taobao,
    Slack, X/Twitter, ride-hailing, hotel/flight/train booking, or food delivery.

  entry:
    primary:
      # Cold-launch (force-stop + relaunch) already lands on a fresh Gemini
      # chat with the input field ready, so no tap sequence and no separate
      # fresh-conversation prep is needed — go straight to input + submit.
      method: tap_sequence
      steps: []

  invocation:
    input:
      # Native EditText exposed by GSA:
      # resource-id `assistant_robin_input_collapsed_text_half_sheet`,
      # hint/text "Ask Gemini". Bounds below are Pixel 9 1080x2424 collapsed
      # half-sheet bounds before keyboard focus.
      field:
        resource_id: "com.google.android.googlequicksearchbox:id/assistant_robin_input_collapsed_text_half_sheet"
        text: "Ask Gemini"
        screen_fraction:
          x_ratio: 0.4514
          y_ratio: 0.9175
    submit:
      # The right-side slot is Gemini Live when empty and becomes send once
      # text is present. After keyboard focus the send button moves upward;
      # prefer a11y grounding over fixed bounds.
      trigger:
        accessibility_id: "Send"

  output:
    method: none

  capabilities:

    - id: foundation_llm
      description: >
        Foundation LLM capability in Gemini: Q&A, explanation, rewriting,
        translation, brainstorming, summarization, extraction, filtering,
        sorting, comparison, deduplication, fact-check-style retrieval, Deep
        Research prompts, arXiv/public-web summaries, arithmetic, unit/date/
        number conversion, and table transformations. Also covers public-web
        lookups previously split out as separate capabilities — GitHub
        repo/issue/commit info, securities/finance info (stock price, dividend
        yield, ESG), and weather — all returned as search-style summaries.
        Pure chat output; source freshness should be verified for high-stakes
        use, and finance results are informational only, not investment advice.
      example_prompts:
        - "Explain the Transformer attention mechanism in three sentences."
        - "Convert USD 1,234.56 to CNY at an exchange rate of 7.1."
        - "Look up the main purpose of the GitHub repository openai/codex."
        - "Look up AAPL's current stock price, dividend yield, and ESG overview, and include sources."
        - "Check today's weather in Shanghai and give a one-sentence conclusion."
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 20
      x_capture_full_reply:
        max_scrolls: 8

    - id: poi_nearby_search
      description: >
        POI and nearby-place lookup through Gemini/search. Returns candidate
        places, addresses, and rough local information, but does not open maps,
        start navigation, or verify live business status.
      # Fixed submit template — planner extracts {poi}/{place} only (qualifiers
      # fold into {poi}); wording stays fixed. {place} is optional: the
      # `[ near {place}]` segment drops entirely when no place is given.
      prompt_template: "Find {poi}[ near {place}]"
      prompt_slots:
        - name: poi
          desc: "target place type incl. qualifiers, e.g. 'highly rated coffee shops'"
          required: true
        - name: place
          desc: "reference location, e.g. 'the south gate of Shanghai Concert Hall'; leave empty if unspecified"
          required: false
      example_prompts:
        - "Find three coffee shops near the south gate of Shanghai Concert Hall."
        - "What indoor venues near Century Park Gate 7 are good for children?"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 25
      x_capture_full_reply:
        max_scrolls: 8

    - id: route_planning
      description: >
        Route planning and travel-estimate guidance through Gemini/search:
        address parsing, route options, approximate distance/time/cost, and
        transit/driving comparisons. It does not start live navigation.
      example_prompts:
        - "How do I get from the north gate of Shanghai Grand Theatre to the south square entrance of Shanghai South Railway Station? Estimate distance, time, and cost."
        - "Parse this address: AI Tower, Tower A, West Bund, Xuhui Riverside."
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 25
      x_capture_full_reply:
        max_scrolls: 8

    - id: live_navigation
      description: >
        Gemini will open Google Map to Navigate to the place.
      # Fixed submit template — the planner LLM only extracts {place} (+ optional
      # {mode}); the wording stays "Navigate to ..." so Gemini reliably triggers
      # the maps navigation CTA instead of a route-description answer. The
      # `[ by {mode}]` segment is dropped entirely when no travel mode is given,
      # so the default stays byte-identical to "Navigate to {place}.".
      prompt_template: "Navigate to {place}[ by {mode}]."
      prompt_slots:
        - name: place
          desc: "destination name or address"
          required: true
        - name: mode
          desc: "travel mode if the user specified one (e.g. driving, walking, transit, cycling); omit otherwise"
          required: false
      example_prompts:
        - "Navigate to the nearest metro entrance near the outpatient building of Shanghai Children's Medical Center."
        - "Help me start navigation to the south entrance of Hongqiao Railway Station."
      executable: false
      handoff_to_user_required: true
      typical_latency_seconds: 20
      # Navigation just yields a CTA/handoff — no text reply to wait on, so go
      # straight from submit to user handoff.
      x_skip_wait_for_reply: true

    - id: write_calendar
      description: >
        Google Calendar event creation when the account and connector are
        authorized. This is a real side-effect capability and should require
        explicit user intent before creating or modifying calendar data.
      # Fixed submit template — the planner LLM only extracts the slots; wording
      # stays imperative so Gemini triggers calendar event creation.
      prompt_template: 'Create a calendar event titled "{title}" at {time}.'
      prompt_slots:
        - name: title
          desc: "event title"
          required: true
        - name: time
          desc: "event date and time, e.g. 'tomorrow at 10 AM'"
          required: true
      example_prompts:
        - "Create a 30-minute calendar event tomorrow at 10 AM titled Gemini capability test."
        - "Schedule a one-hour project sync next Monday at 3 PM."
      executable: true
      handoff_to_user_required: false
      typical_latency_seconds: 15

    - id: read_calendar
      description: >
        Google Calendar read and summarization when the account and connector
        are authorized. The assistant can answer schedule, availability, and
        date-range questions without modifying calendar data.
      example_prompts:
        - "Show me what events I have tomorrow morning."
        - "Summarize my meetings for this week."
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 15

    - id: set_alarm_reminder
      description: >
        Reminder, Google Tasks reminder, or alarm setting when authorized. This
        writes user-visible reminder/alarm state and requires explicit intent.
      # Fixed submit template — planner extracts {time}/{content} only; wording
      # stays fixed so Gemini sets a reminder/alarm rather than answering about it.
      prompt_template: "Set a reminder for {time}[: {content}]."
      prompt_slots:
        - name: time
          desc: "when it should fire, e.g. '7 AM tomorrow'"
          required: true
        - name: content
          desc: "what to be reminded of; leave empty for a plain alarm"
          required: false
      example_prompts:
        - "Remind me to drink water at 9 PM tonight."
        - "Set an alarm for 7 AM tomorrow morning."
      executable: true
      handoff_to_user_required: false
      typical_latency_seconds: 12

    - id: read_email
      description: >
        Gmail search/read/summarization when Google account connectors are
        authorized. The assistant can search accessible messages and summarize
        matches; no outbound message is sent.
      example_prompts:
        - "Find my most recent email from GitHub and summarize it in one sentence."
        - "Find last week's emails about meetings and summarize the time and location."
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 25
      x_capture_full_reply:
        max_scrolls: 4

    - id: write_email
      description: >
        Email drafting in Gemini, including recipient, subject, and body. Direct
        sending was refused in the tested app surface, so the user must copy or
        send manually in an email client.
      # Fixed submit template — planner extracts the slots only; wording stays
      # fixed and ends with an explicit "do not send" to keep drafting safe.
      # {cc} is optional: its `[ CC: {cc}.]` segment drops entirely when absent.
      prompt_template: 'Draft an email to {recipient} with subject "{subject}" and body: {body}.[ CC: {cc}.] Do not send it.'
      prompt_slots:
        - name: recipient
          desc: "recipient address or name"
          required: true
        - name: subject
          desc: "email subject line"
          required: true
        - name: body
          desc: "email body text"
          required: true
        - name: cc
          desc: "carbon-copy recipients; leave empty if none"
          required: false
      example_prompts:
        - "Draft an email to test@example.com with subject Test and a one-sentence body; do not send it."
        - "Draft an email explaining a project delay; do not send it."
      executable: false
      handoff_to_user_required: true
      typical_latency_seconds: 15

    - id: read_sms
      description: >
        SMS read behavior in Gemini. The tested surface could check current
        notifications for SMS/message notifications, but direct SMS database
        access was not verified. Read-only; do not send or draft a reply through
        this capability.
      example_prompts:
        - "Summarize my most recent SMS message; say so if SMS cannot be accessed."
        - "Summarize the SMS notifications I received today without replying."
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 20

    - id: read_memo
      description: >
        Notes or memo read/search behavior through Gemini when connected note
        sources are available. The assistant can search accessible notes and
        summarize matches without editing them.
      example_prompts:
        - "Check my recent project notes for action items."
        - "Summarize notes whose title contains travel."
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 20

    - id: write_memo
      description: >
        Notes or memo drafting/editing guidance through Gemini. Creating or
        changing persistent notes writes user data, so the user should review
        the content before it is saved.
      # Fixed submit template — planner extracts {content} only; wording stays
      # fixed so Gemini creates a note instead of answering about notes.
      prompt_template: "Create a note: {content}."
      prompt_slots:
        - name: content
          desc: "the note title or body to save"
          required: true
      example_prompts:
        - "Create a note titled RelayAgent test."
        - "Write a note reminding me to buy coffee beans tomorrow."
      executable: true
      handoff_to_user_required: false
      typical_latency_seconds: 15

    - id: read_task
      description: >
        Task-list read/search behavior through Gemini or connected Google Tasks.
        The assistant can summarize due tasks, overdue items, and task lists
        without modifying them.
      example_prompts:
        - "Show me my tasks for today."
        - "Summarize tasks due this week."
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 15

    - id: write_task
      description: >
        Task creation or task update behavior through Gemini or connected Google
        Tasks. This writes user-visible task state and requires explicit user
        intent in the prompt.
      # Fixed submit template — planner extracts {content} only; wording stays
      # fixed so Gemini creates a task instead of answering about tasks.
      prompt_template: "Create a task: {content}."
      prompt_slots:
        - name: content
          desc: "the task description, including any due time"
          required: true
      example_prompts:
        - "Add a task to submit the report tomorrow at 3 PM."
        - "Create a task: organize experiment notes by Friday."
      executable: true
      handoff_to_user_required: false
      typical_latency_seconds: 15

    - id: operate_system_settings
      description: >
        System settings guidance through Gemini. Gemini can explain or prepare
        settings changes such as Wi-Fi, Bluetooth, brightness, or permissions,
        but direct device-setting mutation is not verified in the tested surface.
      example_prompts:
        - "Help me open Bluetooth settings."
        - "Tell me how to turn off auto brightness."
      executable: false
      handoff_to_user_required: true
      typical_latency_seconds: 15

    - id: send_sms
      description: >
        SMS send or SMS-draft behavior in Gemini. Sending is unverified and
        potentially irreversible, so never automate a final SMS send action
        without explicit user approval and a visible system confirmation.
      # Fixed submit template — planner extracts recipient/message only; the
      # final send confirmation is still left to the user via handoff.
      prompt_template: 'Send a text message to {contact}: "{message}"'
      prompt_slots:
        - name: contact
          desc: "recipient name or phone number"
          required: true
        - name: message
          desc: "the message body"
          required: true
      example_prompts:
        - "Send this phone number a text message: I will arrive later."
        - "Draft a text to this number: I will arrive in ten minutes; do not send it directly."
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 25

    - id: find_gallery_image
      description: >
        Finding images/photos from the device gallery and answering questions
        about them via Gemini's attachment menu or camera/gallery. The user
        selects a photo from the gallery and asks about its contents
        (screenshot/photo Q&A, object identification, extraction).
      example_prompts:
        - "Choose a refrigerator photo from the gallery and identify the ingredients inside."
        - "Open the whiteboard photo in the gallery and read the content on it."
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 30
      x_attachment_entry:
        text_or_desc: "Add attachment"
        screen_fraction:
          x_ratio: 0.1463
          y_ratio: 0.9175
      x_attachment_options_observed:
        - "Gallery"
        - "Camera"
        - "Images"
      x_tool_menu_entry:
        open_menu: "Add attachment"
        text_or_desc: "Images"

    - id: generate_slides
      description: >
        Presentation outline or slide-content generation through Gemini chat or
        Canvas. Plain chat can draft slide outlines; actual PPT export/opening
        remains user-handoff until separately scripted.
      example_prompts:
        - "Generate titles and key points for a five-page presentation about AI in education."
        - "Use Canvas to generate an outline for a product launch presentation."
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 25
      x_tool_menu_entry:
        open_menu: "Add attachment"
        text_or_desc: "Canvas"

provenance:
  last_verified: "2026-06-06"
  verified_app_version: "1.0.913571982"
  x_verified_google_app_version: "17.26.28.sa.arm64"
  verified_os: "android-16"
  verified_device: "Pixel 9"
  verification_method: scripted
  evidence_url: ""
  x_probe_evidence_dir: "/tmp/gemini_probe_results"
  x_device_metrics:
    resolution_px: [1080, 2424]
    density_dpi: 420

constraints:
  app_version_min: "1.0.913571982"
  region: ["US", "CN"]
  network_required: true
  known_issues:
    - "Launcher package is `com.google.android.apps.bard`, but the visible UI package in uiautomator is `com.google.android.googlequicksearchbox`; selectors should not assume package equality."
    - "The chat input is a native EditText with hint/text `Ask Gemini`, while much of the toolbar is Compose with sparse accessibility metadata."
    - "Cold-launch (force-stop + relaunch) already opens a fresh Gemini chat with the input field ready, so no `New chat` tap or other entry step is needed before typing."
    - "The rightmost input button changes role: empty input opens Gemini Live; after text entry the same slot becomes send (`content-desc=Send`). Its visible center moved to about (923, 2110) after keyboard focus on Pixel 9; use a11y/text grounding instead of fixed bottom bounds."
    - "The attachment button exposes content-desc `Add attachment`; observed options include Gallery, Camera, Files, Drive, Images, Music, Canvas, Deep Research, Learning Coach, and Labs personalization."
    - "Mode chips shift the input sheet upward; after entering a mode, button coordinates differ from the normal collapsed chat sheet."
    - "Some Gemini rich cards or WebView-heavy answers are visible on screen but uiautomator text capture may return only the generic disclaimer or status-bar time. This affected weather, stock, and one PPT-outline probe."
    - "Feature availability depends heavily on Google account, Gemini plan, connected-app settings, country/region, permissions, and workspace policies. Gmail/Calendar/Tasks capabilities are not guaranteed for every account."
    - "Do not automate irreversible side effects such as SMS send, calendar creation, reminders, alarms, payments, bookings, checkout, or social posting without explicit user intent and a visible confirmation/handoff policy."
    - "Gemini repeatedly stated it cannot directly access local files, phone contacts, camera roll, Taobao orders, Slack workspace, X/Twitter account, external payment systems, or third-party logistics systems in the tested surface."
