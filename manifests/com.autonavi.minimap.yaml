spec_version: "0.1"
card_version: "0.2.0"
app_id: "com.autonavi.minimap"
app_name: "高德地图"
platforms: ["android"]
locale: ["zh-CN"]

embedded_agent:
  name: "高德 AI 助手"
  description: >
    Amap's bottom-center "Press to Talk" tab hosts a built-in AI assistant
    supporting text and voice. Excels at nearby POI search, route planning
    (with one-tap "Navigate" CTA), ride hailing, and multi-day trip planning.
    Travel and local-life scenarios only; explicitly refuses out-of-domain actions.

  entry:
    primary:
      method: tap_sequence
      steps:
        # Bottom-center tab. resource_id "tab_name_v2" shared across 5 tabs;
        # v0.1 single-field selectors can't express "resource_id + text" AND. See OQ-10.
        - tap: { text: "长按说话" }
        - wait: { ms: 300 }
        # The AI tab opens in voice ("按住说话") mode on first install. The
        # hint text "有什么问题尽管问我" is only present in text mode, so
        # treat it as the probe — if absent, tap the keyboard glyph at the
        # bottom-right of the input row to flip. The toggle is stateful
        # across restarts but NOT idempotent, so we use a one-shot
        # conditional tap rather than an unconditional one.
        - tap_unless_present:
            probe: { text: "有什么问题尽管问我" }
            target:
              screen_fraction:
                x_ratio: 0.9051
                y_ratio: 0.8797
        - wait: { ms: 300 }

  invocation:
    input:
      # EditText has no resource-id or content-desc. When unfocused, both
      # `text` and `hint` carry "有什么问题尽管问我"; once tapped, `text`
      # empties out, so the hint-text selector ONLY works pre-focus.
      # screen_fraction is the robust path; the text selector is kept as a hint
      # for matchers that want a semantic anchor.
      field:
        screen_fraction:
          x_ratio: 0.4597
          y_ratio: 0.8797
        text: "有什么问题尽管问我"
    submit:
      # Same ViewGroup: empty → mic icon, has text → send arrow.
      # No id, no content-desc; ratio-only.
      trigger:
        screen_fraction:
          x_ratio: 0.9051
          y_ratio: 0.8690

  output:
    method: none

  capabilities:
    - id: poi_nearby_search
      description: >
        POI and nearby search in Amap for shops, restaurants, gas stations,
        attractions, and other local places. Returns list/map-marker results
        only; it does not start navigation, order, or purchase.
      # 固定提交模板——规划 LLM 只抽 {poi}/{place}（限定词并入 poi），措辞固定。
      prompt_template: "查找[{place}附近的]{poi}"
      prompt_slots:
        - name: poi
          desc: "目标地点类型,含限定词,如'24小时便利店'/'加油站'"
          required: true
        - name: place
          desc: "参照位置,如'复旦大学邯郸校区正门';未指明则留空"
          required: false
      example_prompts:
        - "搜复旦大学邯郸校区正门附近24小时便利店"
        - "上海世博展览馆北入口附近有什么加油站"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 5
      x_capture_full_reply:
        max_scrolls: 6

    - id: route_planning
      description: >
        Route planning in Amap, including destination disambiguation, distance,
        ETA, traffic information, and route options. The assistant may show a
        Navigate CTA, but scripted flows stop before live turn-by-turn guidance
        so the user can choose mode and confirm.
      example_prompts:
        - "导航到上海科技馆2号门"
        - "我现在去上海南站南广场进站口要多久"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 8

    - id: live_navigation
      description: >
        Turn-by-turn live navigation in Amap. The assistant can prepare the
        destination and route, but starting live guidance affects real-world
        movement and should be confirmed by the user.
      # 固定提交模板（zh-CN）——规划 LLM 只抽取 {place}；
      # 用「导航去…」稳定触发高德的导航流程，而非返回路线描述。
      prompt_template: "导航去{place}"
      prompt_slots:
        - name: place
          desc: "目的地名称或地址"
          required: true
      example_prompts:
        - "开始导航去浦东足球场3号门"
        - "导航去中山医院门诊楼附近最近的地铁站入口"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 8
      # Navigation just yields a CTA/handoff — no text reply to wait on, so go
      # straight from submit to user handoff.
      x_skip_wait_for_reply: true

    - id: hail_ride
      description: >
        Ride hailing through Amap's aggregator. The assistant helps confirm
        origin/destination, car type, estimate, and payment path, with every
        irreversible confirmation left to the user.
      # 固定提交模板——规划 LLM 只抽 {place}/{car_type},措辞固定以稳定触发打车流程。
      prompt_template: "叫一辆[{car_type}]车去{place}"
      prompt_slots:
        - name: place
          desc: "目的地名称或地址"
          required: true
        - name: car_type
          desc: "车型,如经济型/舒适型;未指明则留空"
          required: false
      example_prompts:
        - "叫一辆经济型车去前滩太古里木区北门"
        - "帮我叫个车去上海图书馆东馆南门"
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 10
      x_capture_full_reply:
        max_scrolls: 3

provenance:
  last_verified: "2026-05-11"
  verified_app_version: "16.16.0.2001"
  verified_os: "android-16"
  verified_device: "Pixel 9"
  verification_method: scripted
  evidence_url: ""
  x_device_metrics:
    resolution_px: [1080, 2424]
    density_dpi: 420

constraints:
  app_version_min: "16.16.0"
  region: ["CN"]
  network_required: true
  known_issues:
    - "Entry tab text says 'Press to Talk' (voice-oriented) but also accepts text input."
    - "Input field and send/mic button have no accessibility id or content-desc; selectors rely on hint text and absolute bounds."
    - "AI tab defaults to voice mode (按住说话) on first install; the keyboard toggle that flips it to text mode is non-idempotent and stateful across restarts; toggle to text mode manually before scripted runs."
    - "Send button and mic are the same ViewGroup: empty input shows mic, text shows send arrow."
    - "Secondary taps inside agent response cards may not respond to scripted clicks during TTS playback. User manual taps unaffected."
    - "Home screen card 'Call me' is a chat prompt, not actual phone call support — agent refuses dialing requests."
