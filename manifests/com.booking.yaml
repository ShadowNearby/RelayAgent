spec_version: "0.1"
card_version: "0.1.0"
app_id: "com.booking"
app_name: "Booking.com"
platforms: ["android"]
locale: ["en-US"]

embedded_agent:
  name: "AI Chat (Beta)"
  description: >
    Booking.com's in-app AI travel assistant, reached from the home-page trip
    planning card. It helps explore travel information: accommodation ideas,
    activities and experiences, destination recommendations, itinerary drafts,
    and travel Q&A. It can narrow choices inside Booking.com, but reservation
    and payment flows require user handoff.

  entry:
    primary:
      method: tap_sequence
      steps:
        # From the Search/home tab, the AI trip-planning card sits below the
        # booking search box and promotions. In RelayAgent's current scroll
        # mapping, `swipe: down` produces a finger-up gesture, revealing content
        # below the current viewport. Seven such short runtime scrolls expose
        # the card with its CTA around y~=1866 on the
        # verified 1080x2424 device.
        - swipe: down
        - swipe: down
        - swipe: down
        - swipe: down
        - swipe: down
        - swipe: down
        - swipe: down
        # Button text varies with chat history: "Plan a trip for me" for first
        # use, "Continue planning" when there is prior context. Use the stable
        # card-button
        # position after the seven scrolls.
        - tap:
            screen_fraction:
              x_ratio: 0.2204
              y_ratio: 0.7700
        - wait: { until: { text: "AI Chat (Beta)" }, timeout_seconds: 8 }
        # The chat opens with sticky history; the top-right plus starts a
        # blank conversation before we focus the input.
        - tap: { accessibility_id: "Start new conversation" }
        - wait: { until: { text: "Write a message" }, timeout_seconds: 5 }

  invocation:
    input:
      field: { text: "Write a message" }
    submit:
      trigger: { accessibility_id: "Send message" }

  output:
    method: none

  capabilities:

    - id: poi_nearby_search
      description: >
        Travel-oriented activity, attraction, and experience discovery through
        Booking.com's AI assistant. Use for things to do, attractions,
        experiences, neighborhoods, family activities, and local travel ideas
        tied to a destination or lodging area. It returns recommendations and
        context, not turn-by-turn navigation or purchase completion.
      # Fixed submit template — planner extracts {poi}/{place} only (qualifiers
      # fold into {poi}); wording stays fixed. {place} is optional: the
      # `[ near {place}]` segment drops entirely when no place is given.
      prompt_template: "Find {poi}[ near {place}]"
      prompt_slots:
        - name: poi
          desc: "activity/experience type incl. qualifiers, e.g. 'rainy-day experiences'"
          required: true
        - name: place
          desc: "destination or lodging area, e.g. 'Ginza in Tokyo'; leave empty if unspecified"
          required: false
      example_prompts:
        - "What rainy-day experiences are available near Ginza in Tokyo?"
        - "If I am staying near King's Cross in London, where can I go in the evening?"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 20
      x_capture_full_reply:
        max_scrolls: 6

    - id: plan_trip
      description: >
        Informational itinerary planning in Booking.com's AI chat. The assistant
        drafts day-by-day travel plans and can suggest neighborhoods, lodging
        areas, activities, and experiences. It does not autonomously book
        hotels or paid activities; any bookable follow-up remains user-operated.
      example_prompts:
        - "Plan a three-day itinerary for New York City."
        - "How should I arrange lodging and sightseeing for a four-day Kyoto trip with my parents?"
      executable: false
      handoff_to_user_required: false
      typical_latency_seconds: 25
      x_capture_full_reply:
        max_scrolls: 8

    - id: book_hotel
      description: >
        Accommodation search and booking preparation through Booking.com's AI
        assistant. The assistant can interpret destination, date, guest, budget,
        and preference constraints and surface suitable stays or guidance.
        Selecting rooms, entering guest details, and confirming reservations or
        payments require user handoff.
      example_prompts:
        - "Beachfront hotels in Miami next summer."
        - "Hotels near the Bund in Shanghai for two nights next weekend, with a budget under 800 CNY per night."
      executable: true
      handoff_to_user_required: true
      typical_latency_seconds: 25
      x_capture_full_reply:
        max_scrolls: 6

provenance:
  last_verified: "2026-06-07"
  verified_app_version: "66.4"
  verified_os: "android-16"
  verified_device: "Pixel 9"
  verification_method: manual
  evidence_url: ""
  x_device_metrics:
    resolution_px: [1080, 2424]
    density_dpi: 420

constraints:
  app_version_min: "66.4"
  region: ["CN", "US"]
  network_required: true
  known_issues:
    - "Home-page AI card appears below the first-screen search and promotions; entry uses seven calibrated runtime scrolls before tapping the card button."
    - "AI card CTA text is stateful: first use shows 'Plan a trip for me', existing chat history can show 'Continue planning'. The card uses a screen-fraction tap at the shared CTA position."
    - "Chat history is sticky across launches; the entry path always taps the top-right plus button (content-desc='Start new conversation') before invocation."
    - "The assistant is labelled beta in UI ('AI Chat (Beta)') and may make mistakes; use it for exploration and booking preparation, not autonomous paid reservations."
    - "Input and send affordances expose no resource-id; selectors rely on visible placeholder text 'Write a message' and content-desc 'Send message'."
