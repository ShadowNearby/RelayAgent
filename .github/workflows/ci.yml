name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Skip the `mw` extra: MobileWorld is a git dependency only the on-device
      # A/B baseline needs; nothing in CI imports it.
      - name: Sync dependencies
        run: uv sync --no-install-project --extra dev

      - name: Unit tests (device-less)
        run: uv run python -m unittest discover -s tests -v

      - name: Validate manifests against spec/schema.json
        run: uv run python scripts/validate/validate_manifests.py

      - name: Validate RelayBench task suite
        run: uv run python scripts/validate/validate_relaybench.py

      - name: Entry-point import smoke
        run: |
          uv run python - <<'EOF'
          import importlib
          for mod in (
              "agents.runtime.native_runner",
              "agents.agent.relay_agent",
              "agents.agent.general_agent",
              "agents.flow.flow_planner",
              "agents.flow.flow_runner",
              "agents.routing.capability_matrix_router",
          ):
              importlib.import_module(mod)
              print(f"ok: {mod}")
          EOF

  # The on-device app: Chaquopy bundles agents/ + manifests into the APK at
  # build time (syncRelayPython), so Python-side changes can break the Android
  # build too — build it on every PR, not just on android/ changes.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Chaquopy's buildPython: must match the version pinned in
      # android/app/build.gradle.kts (chaquopy { version = "3.12" }).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Android SDK (API 34) is preinstalled on ubuntu-latest runners;
      # sdk.dir resolves from ANDROID_HOME (local.properties is untracked).
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
