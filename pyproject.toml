[project]
name = "relayagent"
version = "0.1.0"
description = "Mobile agent that decomposes a user request into subtasks and delegates them to the AI assistants embedded in each app"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jingsheng Yan", email = "yan.jingsheng@outlook.com" },
]
# 3.12 floor kept for the runtime (matches the resolved lock / .venv). The
# real-device runner is now pure-Python over adb (agents/runtime/native_runtime.py), so
# there is no longer an external runtime forcing the version.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Card loader + manifest parsing.
    "pyyaml>=6.0",
    # Used across agents/ for structured logging.
    "loguru>=0.7",
    # The LLM client (capability router, grounding, reply-watch).
    "openai>=1.0",
    # Screenshot decode/encode for VLM grounding / reply-watch + native capture.
    "pillow>=10.0",
    # No direct pydantic dependency: JSONAction is pure Python (the Android
    # build's Chaquopy has no pydantic-core wheel). openai still pulls pydantic
    # in transitively on host; our code must not import it.
    "socksio>=1.0.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Only the A/B baseline (scripts/run_mobileworld.py) and MW-fallback legs use
# MobileWorld, and nothing imports it at entry-point load (run_mobileworld
# resolves a third_party/MobileWorld checkout first, the installed module
# second). Install with: uv sync --no-install-project --extra mw
mw = ["mobile-world"]
# Manifest schema validation (scripts/validate_manifests.py, CI).
dev = ["jsonschema>=4.17"]
# scrcpy streaming capture backend (agents/device/android_stream.py,
# RELAY_CAPTURE_BACKEND=scrcpy). Host-side only — the on-device app captures
# via MediaProjection and never imports this. PyAV decodes the raw H.264
# stream. Install with: uv sync --no-install-project --extra stream
stream = ["av>=12"]

[project.urls]
Homepage = "https://github.com/ShadowNearby/RelayAgent"
Repository = "https://github.com/ShadowNearby/RelayAgent"
Issues = "https://github.com/ShadowNearby/RelayAgent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# We don't ship a Python package directory (the runtime modules live under
# `agents/` and `scripts/`). Tell hatchling which directories to package so
# `uv pip install .` / editable installs don't fail trying to auto-discover
# a `src/` or `relayagent/` layout that doesn't exist.
[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.hatch.build.targets.sdist]
include = [
    "agents/",
    "scripts/",
    "manifests/",
    "spec/",
    "tests/",
    "SPEC.md",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
    ".env.example",
]

[tool.uv.sources]
mobile-world = { git = "https://github.com/ShadowNearby/MobileWorld", rev = "12306ff9795f6b94bfffac8e9667c9eb4f8349f3" }
