[project]
name = "relayagent"
version = "0.1.0"
description = "Community registry of machine-readable cards describing AI agents embedded inside mobile apps"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jingsheng Yan", email = "yan.jingsheng@outlook.com" },
]
# 3.12 floor kept for the runtime (matches the resolved lock / .venv). The
# real-device runner is now pure-Python over adb (agents/native_runtime.py), so
# there is no longer an external runtime forcing the version.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Card loader + manifest parsing.
    "pyyaml>=6.0",
    # Used across agents/ for structured logging.
    "loguru>=0.7",
    # The LLM client (capability router, grounding, reply-watch).
    "openai>=1.0",
    # Screenshot decode/encode for VLM grounding / reply-watch + native capture.
    "pillow>=10.0",
    # agents/action_model.py's JSONAction is a pydantic model. The <2.11 pin is
    # kept conservative so validator behaviour matches the resolved lock.
    "pydantic<2.11",
    "socksio>=1.0.0",
    "mobile-world",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ShadowNearby/RelayAgent"
Repository = "https://github.com/ShadowNearby/RelayAgent"
Issues = "https://github.com/ShadowNearby/RelayAgent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# We don't ship a Python package directory (the runtime modules live under
# `agents/` and `scripts/`). Tell hatchling which directories to package so
# `uv pip install .` / editable installs don't fail trying to auto-discover
# a `src/` or `relayagent/` layout that doesn't exist.
[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.hatch.build.targets.sdist]
include = [
    "agents/",
    "scripts/",
    "manifests/",
    "spec/",
    "tests/",
    "SPEC.md",
    "SPEC-OPEN-QUESTIONS.md",
    "README.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    ".env.example",
]

[tool.uv.sources]
mobile-world = { git = "https://github.com/ShadowNearby/MobileWorld", rev = "12306ff9795f6b94bfffac8e9667c9eb4f8349f3" }
