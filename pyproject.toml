[project]
name = "relayagent"
version = "0.1.0"
description = "Community registry of machine-readable cards describing AI agents embedded inside mobile apps"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jingsheng Yan", email = "yan.jingsheng@outlook.com" },
]
# 3.12 is required because the MobileWorld runtime that drives
# agents/relay_agent.py pins ">=3.12,<3.13". The bare card loader
# (manifests + agents/card_loader.py) would work on older Pythons, but the
# real-device runner won't, so we keep one floor.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Card loader + manifest parsing.
    "pyyaml>=6.0",
    # Used across agents/ for structured logging.
    "loguru>=0.7",
    # FlowRunner's extract step talks to an OpenAI-compatible LLM endpoint.
    "openai>=1.0",
    # Screenshot encoding for the VLM grounding / reply-watch calls.
    "pillow>=10.0",
    # MobileWorld pulls in fastmcp 2.9.2, which is incompatible with
    # pydantic >=2.11 (Settings model declares both `default` and
    # `default_factory` on the same field → TypeError at import time).
    # Pin the last compatible release. See CLAUDE.md for context.
    "pydantic<2.11",
    # Real-device runner. Sourced from a local checkout via [tool.uv.sources]
    # below — there is no PyPI release yet. Override the path with the
    # MOBILEWORLD_PATH env var or by editing the source entry.
    "mobile-world",
    "socksio>=1.0.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ShadowNearby/RelayAgent"
Repository = "https://github.com/ShadowNearby/RelayAgent"
Issues = "https://github.com/ShadowNearby/RelayAgent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# We don't ship a Python package directory (the runtime modules live under
# `agents/` and `scripts/`). Tell hatchling which directories to package so
# `uv pip install .` / editable installs don't fail trying to auto-discover
# a `src/` or `relayagent/` layout that doesn't exist.
[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.hatch.build.targets.sdist]
include = [
    "agents/",
    "scripts/",
    "manifests/",
    "spec/",
    "tests/",
    "SPEC.md",
    "SPEC-OPEN-QUESTIONS.md",
    "README.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    ".env.example",
]

[tool.uv.sources]
# MobileWorld is not on PyPI; uv clones it directly. Bump `rev` to upgrade.
# Pinned to the ShadowNearby fork: it is upstream 9baaa2b + four patches
# (MW_WAIT_SECONDS, MW_ADB_TIMEOUT, server-log-to-file, and skip-post-step
# screencap via action_json.skip_screenshot). SSH URL so uv clones with the
# local key. To track upstream again, point back at Tongyi-MAI/MobileWorld and
# rebase the patches. See CLAUDE.md "MobileWorld 依赖" for the patch list.
mobile-world = { git = "ssh://git@github.com/ShadowNearby/MobileWorld.git", rev = "73c8c1b" }
